<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ksudoku</title>
<style>
  /* Pure black/white/grey: e-ink shows mid-tones poorly and ghosts on gradients. */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: #fff; color: #000; font-family: sans-serif; }
  #wrap { margin: 0 auto; padding: 2% 3%; }
  #top { display: table; width: 100%; margin-bottom: 2%; }
  #top > div { display: table-cell; vertical-align: middle; }
  #title, #top .r { width: 1%; white-space: nowrap; } /* shrink to content; the level takes the rest */
  #title { font-weight: bold; }
  #level { text-align: center; }
  #top .r { text-align: right; }
  #ghostBtn { padding: 0.15em 0.35em; margin-right: 0.4em; vertical-align: middle; }
  #ghostBtn img { width: 1.3em; height: 1.3em; display: block; }
  #refresh { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 9; }
  button { font: inherit; background: #fff; color: #000; border: 2px solid #000; border-radius: 6px; padding: 0.3em 0.6em; }
  button.on, button.press { background: #000; color: #fff; }

  table { border-collapse: collapse; margin: 0 auto; table-layout: fixed; }
  #board { border: 4px solid #000; background: #fff; } /* tiles stay solid over the picture */
  #board td { border: 1px solid #888; text-align: center; vertical-align: middle; padding: 0; position: relative; }
  #board td.bR { border-right: 3px solid #000; }
  #board td.bB { border-bottom: 3px solid #000; }
  #board td.g { font-weight: bold; }
  #board td.u { color: #444; }
  /* No grey fills: e-ink partial refresh flashes them black. Selection is an outline. */
  #board td.sel { box-shadow: inset 0 0 0 4px #000; }
  #board td.same { text-decoration: underline; }
  #board td.flash { background: #000; color: #fff; }
  #board td.fog { background: #000; } /* solid black is fine on e-ink, mid-greys are not */
  #board td.x { outline: 2px dotted #000; outline-offset: -7px; } /* windoku windows, center cells */
  .notes { overflow: hidden; margin: 0 auto; }
  .notes span { float: left; text-align: center; color: #333; overflow: hidden; }

  #pad { width: 100%; }
  #pad td { padding: 1%; }
  #pad button { width: 100%; padding: 0.4em 0; font-weight: bold; }
  #pad button.done-grey { color: #aaa; border-color: #ccc; border-style: dashed; font-weight: normal; }
  #pad button.done-hide { visibility: hidden; }
  #tools { margin-top: 2%; text-align: center; }
  #tools button { margin: 0 2%; min-width: 30%; }

  /* Mostly-opaque white boxes keep everything readable over the line art. */
  #top, #controls, .box, #toast { background: rgba(255,255,255,0.9); border: 2px solid #000; border-radius: 8px; }
  #top, #controls { padding: 1.5% 2%; }
  #controls { margin-top: 3%; }
  .box { padding: 4%; }

  .sheet { display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: #fff; padding: 6%; overflow: hidden; }
  .sheet.open { display: block; }
  .head { display: table; width: 100%; margin-bottom: 2%; }
  .head > * { display: table-cell; vertical-align: middle; }
  .head h2 { margin: 0; }
  .head .back { text-align: right; }
  .done { font-size: 1.3em; font-weight: bold; border-width: 3px; }
  .shout { margin: -2% 0 5%; text-align: right; font-weight: bold; }
  .shout .arrow { display: inline-block; width: 0; height: 0; margin: 0 0.9em 0 0.4em; vertical-align: middle;
    border-left: 0.45em solid transparent; border-right: 0.45em solid transparent; border-bottom: 0.7em solid #000; }
  .row { margin-bottom: 1em; }
  .lbl { margin-bottom: 0.3em; }
  .row button { margin-right: 2%; }
  .ver { margin: 0; text-align: right; font-size: 0.8em; color: #555; }
  .row .main { min-width: 45%; font-weight: bold; }
  .choice { display: block; width: 100%; text-align: left; padding: 4% 5%; margin-bottom: 4%; }
  .choice b { display: block; font-size: 1.15em; }
  .choice span { display: block; font-size: 0.85em; margin-top: 1%; }
  #pickKind { width: 100%; }
  #kinds td { padding: 0 0 2.5%; vertical-align: middle; }
  #kinds td.i { width: 3em; text-align: right; }
  #kinds .choice { margin: 0; padding: 2.5% 4%; }
  .info { width: 2em; height: 2em; padding: 0; border-radius: 1em; font-family: serif; font-style: italic; font-weight: bold; }
  #top .info { width: 1.6em; height: 1.6em; margin-right: 0.4em; vertical-align: middle; }
  #rulesText { font-size: 1.1em; line-height: 1.4; }
  .choice.half { display: inline-block; width: 47%; margin: 0 2% 4% 0; text-align: center; font-weight: bold; }
  #pickDiff { display: none; }
  #newSheet.diff #pickDiff { display: block; }

  /* Picture backgrounds; the size is set in px from JS (Mesquite's CSS units are unreliable). */
  .pic { background-color: #fff; background-image: url(bg.png); background-repeat: no-repeat; background-position: 70% center; }
  .chk { display: inline-block; width: 0.9em; height: 0.9em; border: 2px solid #000; vertical-align: middle;
    margin-right: 0.4em; background: #fff; }
  .chk.y { background: #000; box-shadow: inset 0 0 0 3px #fff; }

  #achList { list-style: none; margin: 0; padding: 0; }
  #achSheet { padding: 3% 6%; }
  #achList li { padding: 2.5% 0; border-bottom: 1px solid #000; }
  #achList li:last-child { border-bottom: 0; }
  #achList .t { font-weight: bold; }
  #achList .d { margin: 1% 0 0 1.5em; font-size: 0.9em; }
  #achList .locked { color: #555; }
  /* Paged lists with a side bar: up/down buttons and a thumb showing where you are. At the ends the
     buttons grey out instead of vanishing, so nothing moves under your finger. */
  .paged { display: table; table-layout: fixed; width: 100%; }
  .paged > .items { display: table-cell; vertical-align: top; }
  .paged > .bar { display: table-cell; width: 2.4em; padding-left: 0.5em; vertical-align: top; }
  .bar button { display: block; width: 100%; padding: 0.4em 0; }
  .bar button:disabled { border-color: #ccc; border-style: dashed; }
  .track { position: relative; width: 0.7em; margin: 0.4em auto; border: 2px solid #000; border-radius: 0.35em; }
  .thumb { position: absolute; left: 0; right: 0; background: #000; }
  .tri { display: inline-block; width: 0; height: 0; vertical-align: middle;
    border-left: 0.5em solid transparent; border-right: 0.5em solid transparent; border-bottom: 0.7em solid #000; }
  .tri.dn { border-bottom: 0; border-top: 0.7em solid #000; }
  button:disabled .tri { border-bottom-color: #ccc; border-top-color: #ccc; }
  button.press .tri { border-bottom-color: #fff; border-top-color: #fff; }
  #newSheet.diff .paged { display: none; }

  #toast { display: none; position: fixed; left: 6%; right: 6%; top: 3%; padding: 3% 4%; z-index: 8; font-weight: bold; text-align: center; }
  #win { text-align: center; padding-top: 20%; }
  #win h1 { font-size: 3em; margin: 0 0 4%; }
  #winTime { font-size: 1.3em; margin: 0 0 4%; }
  #winAch { text-align: left; margin: 0 auto 6%; max-width: 30em; }
  #egg { text-align: center; padding-top: 15%; }
  #egg img { width: 100%; height: auto; display: block; margin-bottom: 6%; }
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <div id="title">ksudoku</div>
    <div id="level"></div>
    <div class="r"><button class="info" data-info="" aria-label="How to play">i</button><button id="ghostBtn" aria-label="Refresh screen"><img src="ghost.png" alt=""></button><button id="gear">Settings</button></div>
  </div>
  <table id="board"></table>
  <div id="controls">
    <table id="pad"><tr></tr></table>
    <div id="tools">
      <button id="notesBtn">Notes</button><button id="eraseBtn">Erase</button>
    </div>
  </div>
</div>

<div id="settings" class="sheet pic"><div class="box">
  <div class="head">
    <h2>Settings</h2>
    <div class="back"><button id="closeBtn" class="done">Done</button></div>
  </div>
  <!-- .opt bits are dropped first when the screen is too small. -->
  <div class="paged"><div class="items">
    <p class="shout it opt">CLICK THIS TO RETURN TO GAME!!!!!! <span class="arrow"></span></p>
    <div class="row it"><button id="newBtn" class="main">New game</button><button id="restartBtn" class="main">Restart puzzle</button></div>
    <div class="row it"><div class="lbl">When a number is complete</div>
      <button data-done="show">Keep</button><button data-done="grey">Grey out</button><button data-done="hide">Hide</button>
    </div>
    <div class="row it"><button id="bgBtn"><span class="chk" id="bgChk"></span>Picture background</button></div>
    <div class="row it"><button id="timerBtn"><span class="chk" id="timerChk"></span>Show timer</button></div>
    <div class="row it"><button id="achBtn">Achievements <span id="achCount"></span></button></div>
    <p class="ver it opt" id="ver"></p>
  </div><div class="bar"><button data-pg="-1" aria-label="Page up"><span class="tri"></span></button><div class="track"><div class="thumb"></div></div><button data-pg="1" aria-label="Page down"><span class="tri dn"></span></button></div></div>
</div></div>

<!-- New game in two steps: pick the kind, then (for 9x9) the difficulty. -->
<div id="newSheet" class="sheet pic"><div class="box">
  <div class="head">
    <h2>New game</h2>
    <div class="back"><button id="newBack" class="done">Back</button></div>
  </div>
  <!-- (i) shows the rules before you commit to a mode. -->
  <div class="paged"><div class="items"><table id="pickKind"><tbody id="kinds">
    <tr class="it"><td><button data-mode="speed" class="choice"><b>Speed puzzle</b><span class="opt">6x6, timed. Best: <i id="best"></i></span></button></td><td class="i"><button class="info" data-info="speed">i</button></td></tr>
    <tr class="it"><td><button data-mode="classic" class="choice"><b>Standard 9x9</b><span class="opt">Choose a difficulty next</span></button></td><td class="i"><button class="info" data-info="classic">i</button></td></tr>
    <tr class="it"><td><button data-mode="fog" class="choice"><b>Fog of war</b><span class="opt">Clear the fog as you solve</span></button></td><td class="i"><button class="info" data-info="fog">i</button></td></tr>
    <tr class="it"><td><button data-mode="chaos" class="choice"><b>Chaos</b><span class="opt">Irregular boxes</span></button></td><td class="i"><button class="info" data-info="chaos">i</button></td></tr>
    <tr class="it"><td><button data-mode="windoku" class="choice"><b>Windoku</b><span class="opt">4 extra windows</span></button></td><td class="i"><button class="info" data-info="windoku">i</button></td></tr>
    <tr class="it"><td><button data-mode="center" class="choice"><b>Center cells</b><span class="opt">Box centers form a 10th box</span></button></td><td class="i"><button class="info" data-info="center">i</button></td></tr>
  </tbody></table></div><div class="bar"><button data-pg="-1" aria-label="Page up"><span class="tri"></span></button><div class="track"><div class="thumb"></div></div><button data-pg="1" aria-label="Page down"><span class="tri dn"></span></button></div></div>
  <div id="pickDiff">
    <p class="lbl" id="diffLbl"></p>
    <button data-diff="easy" class="choice half">Easy</button><button data-diff="medium" class="choice half">Medium</button>
    <button data-diff="hard" class="choice half">Hard</button><button data-diff="super" class="choice half">Super hard</button>
  </div>
</div></div>

<div id="rulesSheet" class="sheet pic"><div class="box">
  <div class="head">
    <h2 id="rulesTitle"></h2>
    <div class="back"><button id="rulesBack" class="done">Back</button></div>
  </div>
  <div id="rulesText"></div>
</div></div>

<div id="achSheet" class="sheet pic"><div class="box">
  <div class="head">
    <h2>Achievements</h2>
    <div class="back"><button id="achDone" class="done">Done</button></div>
  </div>
  <div class="paged"><div class="items"><ul id="achList"></ul></div><div class="bar"><button data-pg="-1" aria-label="Page up"><span class="tri"></span></button><div class="track"><div class="thumb"></div></div><button data-pg="1" aria-label="Page down"><span class="tri dn"></span></button></div></div>
</div></div>

<div id="win" class="sheet">
  <h1>Solved!</h1>
  <p id="winTime"></p>
  <div id="winAch"></div>
  <button id="winNew">New game</button>
</div>

<div id="egg" class="sheet">
  <img id="eggImg" alt="Problem Sleuth dancing">
  <button id="eggClose">Close</button>
</div>

<div id="toast"></div>
<div id="refresh"></div>

<script src="sudoku.js"></script>
<script>
(function () {
  // super asks for 17 (the theoretical minimum), so the generator strips every clue it can and stays unique.
  var CLUES = { easy: 40, medium: 32, hard: 26, super: 17, speed: 13 };
  var LABEL = { easy: 'Easy', medium: 'Medium', hard: 'Hard', super: 'Super hard', speed: 'Speed' };
  var FOG_CLUES = 46; // more clues than usual: many start hidden under the fog
  var MODES = {
    classic: { t: 'Standard 9x9', rules: 'Fill every row, column and 3x3 box with 1 to 9, each once.' },
    speed: { t: 'Speed puzzle', short: 'Speed', rules: '6x6 grid with 2x3 boxes. Fill every row, column and box with 1 to 6, each once. The clock runs, so beat your best time.' },
    fog: { t: 'Fog of war', short: 'Fog', rules: 'Normal sudoku rules, but most of the board starts under fog (black cells) and the clues under it are hidden. ' +
      'Place a correct digit and the fog clears from the 8 cells around it. A wrong digit clears nothing. You can only write in clear cells. ' +
      'What you can see is always enough to make progress.' },
    chaos: { t: 'Chaos', short: 'Chaos', rules: 'Every row and column holds 1 to 9 once. The 9 boxes are irregular shapes, outlined by thick lines. Each shape also holds 1 to 9 once.' },
    windoku: { t: 'Windoku', short: 'Windoku', rules: 'Normal sudoku rules, plus 4 extra 3x3 windows (the dotted cells). Each window also holds 1 to 9 once.' },
    center: { t: 'Center cells', short: 'Center', rules: 'Normal sudoku rules, plus the center cell of every 3x3 box (the dotted cells). Those 9 cells together also hold 1 to 9 once.' }
  };
  var VERSION = '1.3.1'; // test.js checks this matches manifest.json
  var KEY = 'ksudoku.v1', STATS = 'ksudoku.stats';
  var ACH = [
    { id: 'clean-easy', t: 'No Hints: Easy', d: 'Beat an Easy puzzle without hints.' },
    { id: 'clean-medium', t: 'No Hints: Medium', d: 'Beat a Medium puzzle without hints.' },
    { id: 'clean-hard', t: 'No Hints: Hard', d: 'Beat a Hard puzzle without hints.' },
    { id: 'clean-super', t: 'No Hints: Super Hard', d: 'Beat a Super hard puzzle without hints.' },
    { id: 'speedy', t: 'Speedy Gonzalez', d: 'Beat an Easy puzzle in under 90 seconds.' },
    { id: 'pairs', t: 'Seeing Pairs', d: 'Solve a puzzle that needs naked or hidden pairs.' },
    { id: 'xwing', t: 'X Marks the Spot', d: 'Solve a puzzle that needs an X-Wing.' },
    { id: 'swordfish', t: 'Swordsman', d: 'Solve a puzzle that needs a Swordfish.' },
    { id: 'xywing', t: 'Wing It', d: 'Solve a puzzle that needs an XY-Wing.' },
    { id: 'chains', t: 'Chain Reaction', d: 'Solve a puzzle that needs coloring or chains.' },
    { id: 'corners', t: 'Corner to Corner', d: 'Fill all four corners correctly before anything else.' },
    { id: 'ghost', t: 'Who You Gonna Call?', d: 'Tapped the ghost five times in a row.', hidden: true }
  ];
  var s, st, G, sel = -1, pickMode, notesMode = false, cells = [], keys = [], ghostRun = 0, toastTimer;

  function $(id) { return document.getElementById(id); }
  function setHTML(el, h) { if (el.innerHTML !== h) el.innerHTML = h; } // every write is an e-ink redraw
  function each(list, fn) { for (var i = 0; i < list.length; i++) fn(list[i], i); }
  function zeros(n) { var a = []; for (var i = 0; i < n; i++) a.push(0); return a; }
  function clock(secs) { var m = Math.floor(secs / 60), x = secs % 60; return m + ':' + (x < 10 ? '0' : '') + x; }
  function corners() { var n = G.n; return [0, n - 1, n * (n - 1), n * n - 1]; }
  function cornersDone() { return corners().every(function (i) { return s.val[i] === s.sol[i]; }); }
  var SHEETS = ['settings', 'newSheet', 'rulesSheet', 'achSheet', 'win', 'egg'];
  var TAP_MS = 60;  // lets the pressed look reach the e-ink before slow work starts
  function sheetOpen() { return SHEETS.some(function (id) { return /open/.test($(id).className); }); }
  function closeAll() { each(SHEETS, function (id) { $(id).className = $(id).className.replace(' open', ''); }); }
  function timerOn() { return s.timer !== false; } // on for saves from before the toggle

  function save() { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  function saveStats() { try { localStorage.setItem(STATS, JSON.stringify(st)); } catch (e) {} }
  function load() {
    try {
      var x = JSON.parse(localStorage.getItem(KEY));
      if (!x || !x.val) return null;
      // Saves from before 1.2 had no size, timer or grade.
      if (!x.n) x.n = 9;
      if (x.val.length !== x.n * x.n) return null;
      if (!x.bgPicked) x.bg = true; // on unless the player chose with the toggle
      if (x.secs == null) x.secs = 0;
      if (!x.needs) { x.needs = {}; x.ladder = true; }
      if (!x.mode) x.mode = x.diff === 'speed' ? 'speed' : 'classic'; // before 1.3 there were no variants
      return x;
    } catch (e) { return null; }
  }
  function loadStats() {
    try { var x = JSON.parse(localStorage.getItem(STATS)); if (x && x.got) return x; } catch (e) {}
    return { got: {}, best: null };
  }

  function newGame(mode, diff) {
    var n = mode === 'speed' ? 6 : 9, r;
    if (mode === 'speed') { r = Sudoku.generate(6, CLUES.speed); diff = 'speed'; }
    else if (mode === 'fog') { r = Sudoku.generateFog(FOG_CLUES); diff = null; }
    else r = Sudoku.generateMode(mode, CLUES[diff], /hard|super/.test(diff));
    s = { mode: mode, diff: diff, n: n, done: s ? s.done : 'grey', bg: s ? s.bg : true, bgPicked: s ? s.bgPicked : false, timer: s ? s.timer : true,
          given: r.puzzle, sol: r.solution, val: r.puzzle.slice(), notes: zeros(n * n), won: false,
          needs: r.grade.used, ladder: r.grade.solved, v: r.v, fog0: r.fog || null };
    begin();
  }
  function begin() {  // fresh start of the current puzzle (new game or restart)
    s.val = s.given.slice(); s.notes = zeros(s.n * s.n); s.won = false; s.secs = 0; sel = -1;
    s.fog = s.fog0 && s.fog0.slice();
    build();
    s.corner = corners().some(function (i) { return !s.given[i]; }); // only counts if there's a corner to fill
    save(); render();
  }

  // Board and number pad for the current grid size and box layout.
  function build() {
    G = Sudoku.geom(s.n, s.v);
    if (build.G === G) return;
    build.G = G;
    var n = G.n, b = $('board'), html = '';
    for (var r = 0; r < n; r++) {
      html += '<tr>';
      for (var c = 0; c < n; c++) html += '<td data-i="' + (r * n + c) + '"></td>';
      html += '</tr>';
    }
    b.innerHTML = html;
    cells = b.getElementsByTagName('td');
    var extra = {};
    each(G.extra, function (u) { each(u, function (i) { extra[i] = true; }); });
    each(cells, function (td, i) {  // thick lines between boxes
      var r = Math.floor(i / n), c = i % n;
      td.base = (c < n - 1 && G.box[i] !== G.box[i + 1] ? ' bR' : '') + (r < n - 1 && G.box[i] !== G.box[i + n] ? ' bB' : '') +
        (extra[i] ? ' x' : '');
    });
    var row = $('pad').rows[0], ph = '';
    for (var d = 1; d <= n; d++) ph += '<td><button data-n="' + d + '">' + d + '</button></td>';
    row.innerHTML = ph;
    keys = row.getElementsByTagName('button');
    size();
  }

  // Size from the real viewport: Mesquite's CSS unit support is unreliable.
  var MIN_CELL_PX = 12, MIN_FONT_PX = 14;
  function sizeBoard(cs) {
    each(cells, function (td) { td.style.width = td.style.height = cs + 'px'; td.style.fontSize = Math.floor(cs * (G.n === 9 ? 0.6 : 0.5)) + 'px'; });
    $('board').style.width = cs * G.n + 'px';
    document.body.style.fontSize = Math.max(MIN_FONT_PX, Math.floor(Math.min(cs, window.innerWidth * 0.94 / 9) * 0.4)) + 'px';
    size.cs = cs;
  }
  function size() {
    var W = window.innerWidth, H = window.innerHeight, n = G.n;
    sizeBoard(Math.floor(Math.min(W * 0.94, H * 0.62) / n));
    // Narrow screen: the title goes so the buttons stay on one line.
    $('title').style.display = '';
    if ($('gear').getBoundingClientRect().right > $('wrap').getBoundingClientRect().right) $('title').style.display = 'none';
    // Short screen: shrink the board until the whole game fits without scrolling.
    for (var k = 0; k < 4; k++) {
      var over = $('wrap').offsetHeight - H;
      if (over <= 0 || size.cs <= MIN_CELL_PX) break;
      sizeBoard(Math.max(MIN_CELL_PX, Math.floor(size.cs - over / n) - 1));
    }
    // Menus size from the screen, not the board, so they look the same in every mode.
    var font = Math.max(MIN_FONT_PX, Math.floor(Math.min(W / 24, H / 34))) + 'px';
    each(SHEETS, function (id) { $(id).style.fontSize = font; });
    // Background height matches the screen; width overflows and is cropped around the rider.
    var bgs = 'auto ' + H + 'px';
    each([document.body, $('settings'), $('newSheet'), $('rulesSheet'), $('achSheet')], function (el) { el.style.backgroundSize = bgs; el.style.webkitBackgroundSize = bgs; });
    each(SHEETS, function (id) { if (/open/.test($(id).className) && $(id).querySelector('.paged')) paginate($(id)); });
  }

  function solvedText() { return timerOn() || s.mode === 'speed' ? 'Solved in ' + clock(s.secs) + '.' : ''; }
  function levelText() {
    var m = MODES[s.mode], name = s.mode === 'speed' ? 'Speed' : (m.short && s.diff ? m.short + ' ' : m.short || '') + (s.diff ? LABEL[s.diff] : '');
    return name + (timerOn() ? ' ' + clock(s.secs) : '');
  }
  function openRules(mode) {
    $('rulesTitle').innerHTML = MODES[mode].t;
    $('rulesText').innerHTML = MODES[mode].rules;
    openSheet('rulesSheet');
  }

  // Pages, not scrolling: e-ink can't scroll smoothly. Items (.it) are split into pages measured on
  // the real screen when the sheet opens; if it needs more than one page, the .opt extras go first.
  function openSheet(id, extra) {
    var sh = $(id);
    sh.className = 'sheet pic open' + (extra || '');  // must be on screen to measure
    if (sh.querySelector('.paged')) { sh.page = 0; paginate(sh); }
  }
  function paginate(sh) {
    var bar = sh.querySelector('.bar');
    bar.style.display = '';
    var pages = layout(sh, false);
    if (pages > 1) pages = layout(sh, true);
    sh.pages = pages;
    bar.style.display = pages > 1 ? '' : 'none';
    showPage(sh);
  }
  function layout(sh, lite) {
    var its = sh.querySelectorAll('.it'), items = sh.querySelector('.items');
    each(its, function (it) { it.style.display = ''; });
    each(sh.querySelectorAll('.opt'), function (el) { el.style.display = lite ? 'none' : ''; });
    var box = items.getBoundingClientRect(), avail = window.innerHeight - box.top - box.left; // bottom gap mirrors the side
    var page = 0, start = null;
    each(its, function (it) {
      if (it.style.display === 'none') { it.page = -1; return; }
      var r = it.getBoundingClientRect();
      if (start === null) start = box.top;
      else if (r.bottom - start > avail) { page++; start = r.top; }
      it.page = page;
    });
    var bs = sh.querySelector('.bar').getElementsByTagName('button'), track = sh.querySelector('.track');
    track.style.height = Math.max(MIN_CELL_PX, avail - bs[0].offsetHeight - bs[1].offsetHeight - (track.offsetTop - bs[0].offsetTop - bs[0].offsetHeight) * 2 - 4) + 'px';
    return page + 1;
  }
  function showPage(sh) {
    sh.page = Math.max(0, Math.min(sh.page, sh.pages - 1));
    each(sh.querySelectorAll('.it'), function (it) { it.style.display = it.page === sh.page ? '' : 'none'; });
    var bs = sh.querySelector('.bar').getElementsByTagName('button'), th = sh.querySelector('.track').clientHeight, thumb = sh.querySelector('.thumb');
    bs[0].disabled = sh.page === 0;
    bs[1].disabled = sh.page === sh.pages - 1;
    thumb.style.height = Math.floor(th / sh.pages) + 'px';
    thumb.style.top = Math.floor(th * sh.page / sh.pages) + 'px';
  }

  function render() {
    var n = G.n, counts = zeros(n + 1), selV = sel >= 0 ? s.val[sel] : 0, cs = size.cs;
    each(cells, function (td, i) {
      var v = s.val[i], cls = td.base + (s.given[i] ? ' g' : ' u');
      if (s.fog && s.fog[i]) {  // hidden clues don't count toward a finished number
        cls += ' fog';
        if (td.className !== cls) td.className = cls;
        if (td.key !== 'fog') { td.key = 'fog'; td.innerHTML = ''; }
        return;
      }
      counts[v]++;
      if (i === sel) cls += ' sel';
      if (selV && v === selV && i !== sel) cls += ' same';
      if (td.className !== cls) td.className = cls;  // write only on change: every write is an e-ink redraw
      var key = v ? 'v' + v : 'n' + s.notes[i] + ':' + cs;
      if (td.key === key) return;
      td.key = key;
      if (v) { td.innerHTML = v; return; }
      if (!s.notes[i]) { td.innerHTML = ''; return; }
      // Notes in rows of three; a fixed pixel box so a notes cell never grows taller than its row.
      var t = Math.floor(cs / 3), sp = 'width:' + t + 'px;height:' + t + 'px;line-height:' + t + 'px;font-size:' + Math.floor(cs * 0.26) + 'px';
      var h = '<div class="notes" style="width:' + t * 3 + 'px;height:' + t * (n / 3) + 'px">';
      for (var d = 1; d <= n; d++) h += '<span style="' + sp + '">' + (s.notes[i] & (1 << d) ? d : '&nbsp;') + '</span>';
      td.innerHTML = h + '</div>';
    });
    each(keys, function (k, i) {
      var c = counts[i + 1] >= n && s.done !== 'show' ? 'done-' + s.done : '';
      if (k.className !== c) k.className = c;
    });
    $('notesBtn').className = notesMode ? 'on' : '';
    document.body.className = s.bg ? 'pic' : '';
    $('bgChk').className = s.bg ? 'chk y' : 'chk';
    $('timerChk').className = timerOn() ? 'chk y' : 'chk';
    setHTML($('level'), levelText());
    setHTML($('best'), st.best ? clock(st.best) : 'none yet');
    setHTML($('achCount'), Object.keys(st.got).length + ' of ' + ACH.length);
    each(document.querySelectorAll('[data-diff]'), function (b) { b.className = 'choice half' + (b.getAttribute('data-diff') === s.diff ? ' on' : ''); });
    each(document.querySelectorAll('[data-done]'), function (b) { b.className = b.getAttribute('data-done') === s.done ? 'on' : ''; });
  }

  // ---- achievements ----
  function award(id, quiet) {
    if (st.got[id]) return false;
    st.got[id] = Date.now(); saveStats();
    if (!quiet) toast('Achievement unlocked: ' + ACH.filter(function (a) { return a.id === id; })[0].t);
    return true;
  }
  function toast(msg) {
    var t = $('toast'); t.innerHTML = msg; t.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = 'none'; }, 3500);
  }
  function openAch() {
    $('achList').innerHTML = ACH.map(function (a) {
      var got = !!st.got[a.id], secret = a.hidden && !got;
      return '<li class="it' + (got ? '' : ' locked') + '"><div class="t"><span class="chk' + (got ? ' y' : '') + '"></span>' +
        (secret ? 'HIDDEN. GOOD LUCK' : a.t) + '</div>' + (secret ? '' : '<div class="d">' + a.d + '</div>') + '</li>';
    }).join('');
    openSheet('achSheet');
  }

  function press(d) {
    if (sel < 0 || s.given[sel] || s.won) return;
    if (notesMode) {
      if (s.val[sel]) return;
      s.notes[sel] ^= 1 << d;
    } else {
      s.val[sel] = s.val[sel] === d ? 0 : d;
      s.notes[sel] = 0;
      // Placing a digit clears it from notes it now rules out.
      if (s.val[sel]) each(G.peers[sel], function (i) { s.notes[i] &= ~(1 << d); });
      if (s.fog && s.val[sel] === s.sol[sel]) Sudoku.fogClear(s.fog, sel);
      if (s.val[sel] && s.corner) {
        if (cornersDone()) { s.corner = false; award('corners'); }
        else if (corners().indexOf(sel) < 0) s.corner = false;  // filled something else first
      }
    }
    save(); render();
    if (s.val.join() === s.sol.join()) win();
  }

  // A diagonal wave across the board, then the banner. Few frames: e-ink redraws are slow.
  function win() {
    s.won = true; s.fog = null; save();
    var got = [], u = s.needs;
    function earn(id) { if (award(id, true)) got.push(id); }
    if (s.diff && s.diff !== 'speed') earn('clean-' + s.diff);
    if (s.diff === 'easy' && s.secs < 90) earn('speedy');
    if (u.pairs) earn('pairs');
    if (u.xwing) earn('xwing');
    if (u.swordfish) earn('swordfish');
    if (u.xywing) earn('xywing');
    if (u.coloring || !s.ladder) earn('chains');
    var best = '';
    if (s.diff === 'speed') {
      if (!st.best || s.secs < st.best) { st.best = s.secs; saveStats(); best = ' New best!'; }
      else best = ' (best ' + clock(st.best) + ')';
    }
    $('winTime').innerHTML = solvedText() + best;
    $('winAch').innerHTML = got.length ? '<b>Achievements unlocked</b><ul>' + got.map(function (id) {
      return '<li>' + ACH.filter(function (a) { return a.id === id; })[0].t + '</li>'; }).join('') + '</ul>' : '';
    var step = 0, n = G.n;
    (function frame() {
      each(cells, function (td, i) {
        var dd = Math.floor(i / n) + i % n;
        td.className = td.className.replace(' flash', '') + (dd >= step - 2 && dd <= step ? ' flash' : '');
      });
      step += 3;
      if (step <= 2 * n) setTimeout(frame, 150);
      else setTimeout(function () { $('win').className = 'sheet open'; }, 300);
    })();
  }

  // Black then white over the whole screen makes the Kindle do a full flashing refresh, clearing ghosting.
  function deghost() {
    var o = $('refresh');
    o.style.background = '#000'; o.style.display = 'block';
    setTimeout(function () { o.style.background = '#fff'; }, 250);
    setTimeout(function () { o.style.display = 'none'; }, 500);
  }

  // The clock runs while a puzzle is on screen; it pauses under any sheet.
  setInterval(function () {
    if (!s || s.won || sheetOpen()) return;
    s.secs++;
    if (s.secs % 5 === 0) save();
    if (timerOn()) setHTML($('level'), levelText());
  }, 1000);

  // Generating can take seconds on the Kindle: say so before the CPU is busy.
  function startGame(mode, diff) {
    closeAll();
    toast('Making puzzle...');
    setTimeout(function () { newGame(mode, diff); clearTimeout(toastTimer); $('toast').style.display = 'none'; }, TAP_MS);
  }
  function pickKind(mode) {
    if (mode === 'speed' || mode === 'fog') return startGame(mode);
    pickMode = mode;
    $('diffLbl').innerHTML = MODES[mode].t + ': pick a difficulty';
    $('newSheet').className = 'sheet pic open diff';
  }

  function onTap(e) {
    var t = e.target;
    while (t && t !== document && !t.getAttribute('data-i') && t.tagName !== 'BUTTON') t = t.parentNode;
    if (!t || t === document || t.disabled) return;
    if (t.id !== 'ghostBtn') ghostRun = 0;
    if (t.getAttribute('data-i')) {
      var i = +t.getAttribute('data-i');
      if (s.fog && s.fog[i]) return;
      sel = i; render(); return;
    }
    // Buttons show pressed right away, then act, so a slow action still feels taken.
    t.className += ' press';
    setTimeout(function () { act(t); t.className = t.className.replace(/ ?press/, ''); }, TAP_MS);
  }
  function act(t) {
    if (t.getAttribute('data-pg')) {
      var sh = t;
      while (!/sheet/.test(sh.className)) sh = sh.parentNode;
      sh.page += +t.getAttribute('data-pg'); return showPage(sh);
    }
    if (t.getAttribute('data-info') !== null) return openRules(t.getAttribute('data-info') || s.mode);
    if (t.getAttribute('data-mode')) return pickKind(t.getAttribute('data-mode'));
    if (t.getAttribute('data-n')) return press(+t.getAttribute('data-n'));
    if (t.getAttribute('data-diff')) return startGame(pickMode, t.getAttribute('data-diff'));
    if (t.getAttribute('data-done')) { s.done = t.getAttribute('data-done'); save(); return render(); }
    switch (t.id) {
      case 'gear': openSheet('settings'); break;
      case 'closeBtn': $('settings').className = 'sheet pic'; break;
      case 'achBtn': openAch(); break;
      case 'achDone': $('achSheet').className = 'sheet pic'; break;
      case 'ghostBtn':
        if (++ghostRun < 5) { deghost(); break; }
        ghostRun = 0;
        award('ghost', true);
        $('eggImg').src = 'sleuth.gif?' + Date.now(); // fresh load restarts the animation
        $('egg').className = 'sheet open';
        break;
      case 'eggClose': $('egg').className = 'sheet'; $('eggImg').src = ''; render(); break;
      case 'bgBtn': s.bg = !s.bg; s.bgPicked = true; save(); render(); break;
      case 'timerBtn': s.timer = !timerOn(); save(); render(); break;
      case 'newBtn': openSheet('newSheet'); break;
      case 'rulesBack': $('rulesSheet').className = 'sheet pic'; break;
      case 'newBack': if (/diff/.test($('newSheet').className)) openSheet('newSheet'); else $('newSheet').className = 'sheet pic'; break;
      case 'restartBtn': closeAll(); begin(); break;
      case 'winNew': startGame(s.mode, s.diff); break;
      case 'notesBtn': notesMode = !notesMode; render(); break;
      case 'eraseBtn':
        if (sel >= 0 && !s.given[sel] && !s.won) { s.val[sel] = 0; s.notes[sel] = 0; save(); render(); }
        break;
    }
  }

  document.addEventListener('click', onTap, false);
  window.addEventListener('resize', function () { if (G) { size(); render(); } }, false);
  $('ver').innerHTML = 'ksudoku v' + VERSION;
  st = loadStats();
  s = load();
  if (s) { build(); render(); } else newGame('classic', 'medium');
  if (s.won) { $('winTime').innerHTML = solvedText(); $('win').className = 'sheet open'; }
})();
</script>
</body>
</html>
